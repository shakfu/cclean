name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The ordinary build, on both toolchains and both platforms the project
  # claims to support, with warnings promoted to errors.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    # The ctest timeouts fail a hung suite; this bounds everything else, since
    # a job that hangs outside ctest runs for GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # -Werror here rather than in CMakeLists.txt: a new compiler version
        # must not be able to break an ordinary local build, but a warning
        # must not survive long enough to become normal either.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Werror"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The filesystem races, the numeric limits, and the malformed-input paths
  # are exactly the classes of defect that only show up under instrumentation,
  # so both suites run under the sanitizers rather than only the build.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    runs-on: ubuntu-latest
    # Instrumented builds are slower than the ordinary one on both counts.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
      - name: Build
        run: cmake --build build -j
      # ThreadSanitizer needs a predictable address space, which the runner's
      # ASLR does not give it.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: setarch -R ctest --test-dir build --output-on-failure

  # The jobs above drive cmake directly, so nothing exercised the Makefile:
  # neither its checksum guard against a stale binary nor the quoting of the
  # paths it is given. Both run here, through a build directory and an install
  # prefix whose names contain a space.
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and test through a path with a space
        run: make test BUILD="out dir"
      - name: Install to a prefix with a space
        run: make install BUILD="out dir" PREFIX="$PWD/install prefix"
      - name: Check the installed tree
        run: |
          test -x "$PWD/install prefix/bin/cclean"
          test -f "$PWD/install prefix/lib/libcclean.a"
          test -f "$PWD/install prefix/include/cclean/cclean.hpp"
          "$PWD/install prefix/bin/cclean" --version
      # An edit must invalidate the checksum even when it lands in the same
      # second as the build before it, which is the case an mtime comparison
      # misses and the stamp exists for.
      - name: An edited source forces a rebuild
        run: |
          before=$(cat "out dir/.source-checksum")
          printf '\n// ci probe\n' >> src/version.cpp
          make BUILD="out dir"
          after=$(cat "out dir/.source-checksum")
          test "$before" != "$after"
